; color: #E2C489\">Explore<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><a href=\"#gallery\" class=\"cta-link flink\">Project gallery<\u002Fa><a href=\"#listings\" class=\"cta-link flink\">Now selling<\u002Fa><a href=\"#services\" class=\"cta-link flink\">What we build<\u002Fa><a href=\"#contact\" class=\"cta-link flink\">Visit us<\u002Fa><\u002Fdiv><\u002Fdiv>\n<div><p style=\"margin: 0 0 14px; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #E2C489\">Office<\u002Fp>\n<p style=\"margin: 0; font-size: 14px; line-height: 1.8\">[OFFICE ADDRESS, CITY]<br>[PHONE NUMBER]<br>[EMAIL]<\u002Fp><\u002Fdiv>\n<div><p style=\"margin: 0 0 14px; font-size: 12px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: #E2C489\">Follow<\u002Fp>\n<div style=\"display: flex; flex-direction: column; gap: 4px\"><a href=\"#\" class=\"cta-link flink\">[Instagram]<\u002Fa><a href=\"#\" class=\"cta-link flink\">[LinkedIn]<\u002Fa><a href=\"#\" class=\"cta-link flink\">[YouTube]<\u002Fa><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"max-width: 1240px; margin: 48px auto 0; padding-top: 22px; border-top: 1px solid #2A221C; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 13px\">\n<span>© [YEAR] [YOUR FIRM]. All rights reserved.<\u002Fspan>\n<span>[RERA / REGISTRATION NO.]<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:12800}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.paints = [\n      { z: -500, s: -1 }, { z: -1100, s: 1 }, { z: -1700, s: -1 },\n      { z: -2700, s: 1 }, { z: -3200, s: -1 }, { z: -3900, s: 1 }\n    ];\n    this.state = { room: 'Room 01 · The Residences', count: 'Project 01 / 06', filter: 'all' };\n    this.cur = 0;\n    this.px = { x: 0, y: 0, tx: 0, ty: 0, s: 0 };\n    this.loop = null;\n    this.keys = null;\n    this.tick = this.tick.bind(this);\n    this.kick = this.kick.bind(this);\n    this.onPointer = this.onPointer.bind(this);\n    this.onResize = this.onResize.bind(this);\n  }\n  componentDidMount() {\n    document.addEventListener('scroll', this.kick, { capture: true, passive: true });\n    window.addEventListener('resize', this.onResize, { passive: true });\n    window.addEventListener('pointermove', this.onPointer, { passive: true });\n    setTimeout(this.onResize, 50);\n  }\n  componentWillUnmount() {\n    document.removeEventListener('scroll', this.kick, { capture: true });\n    window.removeEventListener('resize', this.onResize);\n    window.removeEventListener('pointermove', this.onPointer);\n    if (this.loop) cancelAnimationFrame(this.loop);\n  }\n  onResize() {\n    this.els = null;\n    this.keys = null;\n    this.kick();\n  }\n  onPointer(e) {\n    if (e.pointerType && e.pointerType !== 'mouse') return;\n    this.px.tx = (e.clientX / window.innerWidth - 0.5) * 2;\n    this.px.ty = (e.clientY / window.innerHeight - 0.5) * 2;\n    this.kick();\n  }\n  kick() {\n    if (!this.loop) this.loop = requestAnimationFrame(this.tick);\n  }\n  grab() {\n    if (this.els) return this.els;\n    const q = (s) => document.querySelector(s);\n    const stage = q('[data-stage]');\n    if (!stage) return null;\n    const cs = getComputedStyle(stage);\n    this.els = {\n      hero: q('[data-hero]'),\n      layers: Array.prototype.slice.call(document.querySelectorAll('[data-depth]')).map((el) => ({ el, d: parseFloat(el.getAttribute('data-depth')) || 0 })),\n      sec: q('[data-gallery]'), stage, world: q('[data-world]'),\n      intro: q('[data-intro]'), progress: q('[data-progress]'),\n      glows: Array.prototype.slice.call(document.querySelectorAll('[data-glow]')),\n      bulbs: Array.prototype.slice.call(document.querySelectorAll('[data-bulb]')),\n      hw: parseFloat(cs.getPropertyValue('--hw')) || 560,\n      dv: parseFloat(cs.getPropertyValue('--dv')) || 780,\n      P: parseFloat(cs.perspective) || 700\n    };\n    this.keys = this.path(this.els.hw, this.els.dv);\n    return this.els;\n  }\n  path(hw, dv) {\n    const k = [{ cx: 0, cz: 600, y: 0, w: 0, o: -1 }];\n    this.paints.forEach((pt, i) => {\n      const prev = k[k.length - 1];\n      k.push({ cx: 0, cz: pt.z, y: 0, w: Math.max(0.6, Math.abs(prev.cz - pt.z) / 520), o: -1 });\n      k.push({ cx: pt.s * (hw - dv), cz: pt.z, y: pt.s * 90, w: 1, o: i });\n      k.push({ cx: pt.s * (hw - dv), cz: pt.z, y: pt.s * 90, w: 0.8, o: i });\n      k.push({ cx: 0, cz: pt.z, y: 0, w: 0.9, o: i });\n    });\n    k.push({ cx: 0, cz: -4996 + dv, y: 0, w: 2.2, o: -1 });\n    k.push({ cx: 0, cz: -4996 + dv, y: 0, w: 0.5, o: -1 });\n    let total = 0;\n    for (let i = 1; i < k.length; i++) total += k[i].w;\n    k.total = total;\n    return k;\n  }\n  camAt(p) {\n    const k = this.keys;\n    let t = p * k.total, i = 1;\n    while (i < k.length - 1 && t > k[i].w) { t -= k[i].w; i++; }\n    const a = k[i - 1], b = k[i];\n    let f = b.w > 0 ? Math.min(1, t / b.w) : 1;\n    f = f * f * (3 - 2 * f);\n    return { cx: a.cx + (b.cx - a.cx) * f, cz: a.cz + (b.cz - a.cz) * f, y: a.y + (b.y - a.y) * f, a: a.o, b: b.o };\n  }\n  tick() {\n    this.loop = null;\n    const E = this.grab();\n    if (!E) return;\n    let busy = false;\n\n    // hero parallax (mouse + scroll), eased\n    const px = this.px;\n    px.x += (px.tx - px.x) * 0.08;\n    px.y += (px.ty - px.y) * 0.08;\n    if (Math.abs(px.tx - px.x) > 0.001 || Math.abs(px.ty - px.y) > 0.001) busy = true;\n    if (E.hero) {\n      const hr = E.hero.getBoundingClientRect();\n      if (hr.bottom > 0) {\n        const sc = Math.max(0, -hr.top);\n        E.layers.forEach((L) => {\n          const tx = -px.x * 26 * L.d;\n          const ty = -px.y * 14 * L.d + sc * L.d * 0.35;\n          L.el.style.transform = 'translate3d(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px,0)';\n        });\n      }\n    }\n\n    // gallery walk, eased\n    if (E.sec && E.world) {\n      const r = E.sec.getBoundingClientRect();\n      const dist = r.height - E.stage.offsetHeight;\n      let target = dist > 0 ? -r.top / dist : 0;\n      target = Math.max(0, Math.min(1, target));\n      const d = target - this.cur;\n      this.cur += d * 0.1;\n      if (Math.abs(d) > 0.00005) busy = true; else this.cur = target;\n      const inView = r.top < window.innerHeight && r.bottom > 0;\n      if (inView || busy) {\n        const c = this.camAt(this.cur);\n        E.world.style.transform = 'translateZ(' + E.P + 'px) rotateY(' + c.y.toFixed(2) + 'deg) translate3d(' + (-c.cx).toFixed(1) + 'px,0px,' + (-c.cz).toFixed(1) + 'px)';\n        if (E.progress) E.progress.style.width = (this.cur * 100).toFixed(1) + '%';\n        if (E.intro) E.intro.style.opacity = Math.max(0, 1 - this.cur * 30).toFixed(2);\n        const turn = Math.abs(c.y) / 90;\n        E.glows.forEach((g) => {\n          const i = +g.getAttribute('data-glow');\n          const l = (c.a === i || c.b === i) ? turn : 0;\n          g.style.opacity = (0.15 + l * 0.85).toFixed(2);\n        });\n        E.bulbs.forEach((bl) => {\n          const i = +bl.getAttribute('data-bulb');\n          const on = (c.a === i || c.b === i) && turn > 0.5;\n          if (bl._on !== on) {\n            bl._on = on;\n            bl.style.background = on ? '#FFE7B0' : '#B48A4E';\n            bl.style.boxShadow = on ? '0 4px 18px 4px rgba(255,220,150,.8)' : 'none';\n          }\n        });\n        let n = 0;\n        this.paints.forEach((pt) => { if (c.cz <= pt.z + 120) n++; });\n        n = Math.max(1, n);\n        const room = c.cz > -2100 ? 'Room 01 · The Residences' : c.cz > -3500 ? 'Room 02 · The Business District' : c.cz > -4300 ? 'Room 03 · The Hospitality Salon' : 'Room 04 · Your Project';\n        const count = c.cz < -4300 ? 'The next frame is yours' : 'Project ' + String(n).padStart(2, '0') + ' / 06';\n        if (room !== this.state.room || count !== this.state.count) this.setState({ room, count });\n      }\n    }\n    if (busy) this.kick();\n  }\n  renderVals() {\n    const f = this.state.filter;\n    const opts = [['all', 'All homes'], ['villa', 'Villas'], ['apt', 'Apartments'], ['comm', 'Communities']];\n    const chips = opts.map((o) => {\n      const on = f === o[0];\n      return { label: o[1], pressed: on ? 'true' : 'false', bg: on ? '#1B1714' : 'transparent', fg: on ? '#F3ECE0' : '#2B2115', bd: on ? '#1B1714' : '#CDBFA6', pick: () => this.setState({ filter: o[0] }) };\n    });\n    return { roomName: this.state.room, hudCount: this.state.count, chips,\n      show0: f === 'all' || f === 'villa', show1: f === 'all' || f === 'apt', show2: f === 'all' || f === 'comm' };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
